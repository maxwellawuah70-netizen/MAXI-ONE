
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MAXI ONE PASCO</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0b0f15;
      color: white;
      min-height: 100vh;
    }

    header {
      text-align: center;
      padding: 70px 20px 55px;
      background: #171b23;
    }

    header h1 {
      font-size: 42px;
      font-weight: 800;
      margin-bottom: 18px;
    }

    header p {
      color: #9aa1ad;
      font-size: 20px;
    }

    .container {
      max-width: 850px;
      margin: 45px auto;
      padding: 0 20px;
    }

    .card {
      display: block;
      text-decoration: none;
      color: white;
      background: #171b23;
      border: 2px solid #303640;
      border-radius: 22px;
      padding: 30px 25px;
      margin-bottom: 25px;
      text-align: center;
      font-size: 25px;
      transition: 0.2s;
    }

    .card:hover {
      transform: translateY(-3px);
      border-color: #4285f4;
      background: #1d222c;
    }

    .icon {
      font-size: 32px;
      margin-right: 10px;
    }

    footer {
      text-align: center;
      padding: 50px 20px;
      color: #777f8c;
      font-size: 15px;
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 32px;
      }

      header p {
        font-size: 17px;
      }

      .card {
        font-size: 20px;
        padding: 25px 15px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>📚 MAXI ONE PASCO</h1>
    <p>Past Questions &amp; Study Materials</p>
  </header>

  <main class="container">

    <a class="card" href="#">
      <span class="icon">📖</span>
      Ghanaian Language &amp; Culture
    </a>

    <a class="card" href="#">
      <span class="icon">📝</span>
      Written Techniques
    </a>

    <a class="card" href="#">
      <span class="icon">📚</span>
      Past Questions
    </a>

  </main>

  <footer>
    © 2026 MAXI ONE PASCO
    <br>
    Study • Practice • Succeed
  </footer>

</body>
</html>
