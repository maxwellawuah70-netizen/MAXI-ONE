<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MAXI ONE PASCO</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b0f15;
      color: white;
      min-height: 100vh;
    }

    header {
      text-align: center;
      padding: 60px 20px 50px;
      background: #171b23;
    }

    header h1 {
      font-size: 42px;
      font-weight: bold;
      margin-bottom: 18px;
    }

    header p {
      font-size: 21px;
      color: #9da3ae;
    }

    .container {
      max-width: 850px;
      margin: auto;
      padding: 50px 25px;
    }

    .button {
      display: block;
      text-decoration: none;
      color: white;
      background: #171b23;
      border: 2px solid #303641;
      border-radius: 22px;
      padding: 30px 20px;
      margin-bottom: 28px;
      text-align: center;
      font-size: 25px;
      transition: 0.2s;
    }

    .button:hover {
      background: #202631;
      transform: translateY(-2px);
    }

    .emoji {
      margin-right: 10px;
    }

    footer {
      text-align: center;
      color: #777f8c;
      padding: 30px 20px;
      font-size: 15px;
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 32px;
      }

      header p {
        font-size: 18px;
      }

      .button {
        font-size: 21px;
        padding: 27px 15px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>📚 MAXI ONE PASCO</h1>
    <p>Past Questions &amp; Study Materials</p>
  </header>

  <div class="container">

    <a class="button" href="#">
      <span class="emoji">📖</span>
      Ghanaian Language &amp; Culture
    </a>

    <a class="button" href="#">
      <span class="emoji">📝</span>
      Written Techniques
    </a>

    <a class="button" href="#">
      <span class="emoji">📚</span>
      Past Questions
    </a>

  </div>

  <footer>
    © 2026 MAXI ONE PASCO
  </footer>

</body>
</html>
